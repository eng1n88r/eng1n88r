name: Profile assets

# Renders every image on the profile README into assets/ and commits the result.
# The README then serves static files straight out of the repo, so nothing on the
# profile depends on a third-party endpoint being awake, under its rate limit, or
# still free to use.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

env:
  # Required. A classic PAT with `repo` + `read:user`, stored as the PROFILE_TOKEN
  # secret. The job's own GITHUB_TOKEN cannot reach the stats GraphQL API and comes
  # back with "Resource not accessible by integration".
  GH_STATS_TOKEN: ${{ secrets.PROFILE_TOKEN }}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Require a PAT
        run: |
          if [ -z "${GH_STATS_TOKEN:-}" ]; then
            echo "::error::PROFILE_TOKEN secret is not set. Create a classic PAT with" \
                 "repo + read:user scopes and add it as the PROFILE_TOKEN repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@main
        env:
          GITHUB_TOKEN: ${{ env.GH_STATS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/contrib-3d-gta6.json

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ env.GH_STATS_TOKEN }}
          outputs: |
            assets/snake-hud.svg?color_snake=%235EEAD4&color_dots=%230d1117,%23134e4a,%230e7490,%2306b6d4,%235eead4
            assets/snake-neon.svg?color_snake=%23FFC24B&color_dots=%23180D2E,%234B1D80,%23A02A8C,%23FF3D7F,%23FFA34B

      - name: Stat cards
        env:
          PAT_1: ${{ env.GH_STATS_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/anuraghazra/github-readme-stats.git /tmp/grs
          npm --prefix /tmp/grs install --no-audit --no-fund --loglevel=error
          node /tmp/grs/express.js &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:9000/api?username=${{ github.repository_owner }}" && break
            sleep 1
          done

          user="username=${{ github.repository_owner }}&count_private=true&include_all_commits=true"
          dark="bg_color=0D1117&title_color=5EEAD4&text_color=C9D1D9&icon_color=A78BFA&border_color=1F2937"
          light="bg_color=FFFFFF&title_color=0E7490&text_color=24292F&icon_color=6D28D9&border_color=D0D7DE"
          neon="bg_color=140A26&title_color=FF3D7F&text_color=E8D9F0&icon_color=FFC24B&border_color=3D2159"
          stats="show_icons=true&hide=contribs&rank_icon=percentile"
          langs="layout=compact&langs_count=8&hide=html,css"

          get() { curl -sf --retry 3 --max-time 60 "http://127.0.0.1:9000$2" -o "assets/$1"; }
          get stats-dark.svg  "/api?$user&$stats&$dark&custom_title=Signal"
          get stats-light.svg "/api?$user&$stats&$light&custom_title=Signal"
          get langs-dark.svg  "/api/top-langs?$user&$langs&$dark&custom_title=Languages"
          get langs-light.svg "/api/top-langs?$user&$langs&$light&custom_title=Languages"
          get stats-neon.svg  "/api?$user&$stats&$neon&custom_title=SYSTEM%20STATS"
          get langs-neon.svg  "/api/top-langs?$user&layout=donut&langs_count=8&hide=html,css&$neon&custom_title=STACK"

      - name: Reject error cards
        run: |
          set -euo pipefail
          bad=0
          for f in assets/stats-*.svg assets/langs-*.svg; do
            if grep -q "Something went wrong" "$f"; then
              echo "::error::$f rendered as an error card"
              bad=1
            fi
          done
          [ "$bad" = 0 ]

      - name: Bake animation end-states
        run: |
          python3 scripts/bake-svg-animations.py \
            assets/stats-dark.svg assets/stats-light.svg assets/stats-neon.svg \
            assets/langs-dark.svg assets/langs-light.svg assets/langs-neon.svg

      - name: Strip the snake's progress bar
        run: python3 scripts/strip-snake-progressbar.py assets/snake-hud.svg assets/snake-neon.svg

      - name: Place calendar output
        run: |
          cp profile-3d-contrib/profile-gta6.svg assets/contrib-3d-neon.svg
          cp profile-3d-contrib/profile-night-view.svg assets/contrib-3d.svg 2>/dev/null || true
          rm -rf profile-3d-contrib

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh profile assets"
          git push
