name: Profile assets

# Renders every image on the profile README into assets/ and commits the result.
# The README then serves static files straight out of the repo, so nothing on the
# profile depends on a third-party endpoint being awake, under its rate limit, or
# still free to use.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

env:
  # Required. A classic PAT with `repo` + `read:user`, stored as the PROFILE_TOKEN
  # secret. The job's own GITHUB_TOKEN cannot reach the stats GraphQL API and comes
  # back with "Resource not accessible by integration".
  GH_STATS_TOKEN: ${{ secrets.PROFILE_TOKEN }}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Require a PAT
        run: |
          if [ -z "${GH_STATS_TOKEN:-}" ]; then
            echo "::error::PROFILE_TOKEN secret is not set. Create a classic PAT with" \
                 "repo + read:user scopes and add it as the PROFILE_TOKEN repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@main
        env:
          GITHUB_TOKEN: ${{ env.GH_STATS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/contrib-3d-neon.json

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ env.GH_STATS_TOKEN }}
          outputs: |
            assets/neon/snake.svg?color_snake=%2300F0FF&color_dots=%23150a2e,%234c1d95,%237c3aed,%23c026d3,%23ff2e97

      - name: Stat cards
        env:
          PAT_1: ${{ env.GH_STATS_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/anuraghazra/github-readme-stats.git /tmp/grs
          npm --prefix /tmp/grs install --no-audit --no-fund --loglevel=error
          node /tmp/grs/express.js &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:9000/api?username=${{ github.repository_owner }}" && break
            sleep 1
          done

          user="username=${{ github.repository_owner }}&count_private=true&include_all_commits=true"
          neon="bg_color=05010D&title_color=FF2E97&text_color=B9C4D4&icon_color=00F0FF&border_color=2A1B4D"
          stats="show_icons=true&hide=contribs&rank_icon=percentile"
          langs="layout=compact&langs_count=8&hide=html,css"

          get() { curl -sf --retry 3 --max-time 60 "http://127.0.0.1:9000$2" -o "assets/$1"; }
          get neon/system-stats.svg "/api?$user&$stats&line_height=29&$neon&custom_title=SYSTEM%20STATS"
          get neon/languages.svg  "/api/top-langs?$user&$langs&card_width=467&$neon&custom_title=STACK"

      - name: Reject error cards
        run: |
          set -euo pipefail
          bad=0
          for f in assets/neon/system-stats.svg assets/neon/languages.svg; do
            if grep -q "Something went wrong" "$f"; then
              echo "::error::$f rendered as an error card"
              bad=1
            fi
          done
          [ "$bad" = 0 ]

      - name: Bake animation end-states
        run: |
          python3 scripts/bake-svg-animations.py assets/neon/system-stats.svg assets/neon/languages.svg

      - name: Strip the snake's progress bar
        run: python3 scripts/strip-snake-progressbar.py assets/neon/snake.svg

      - name: Place calendar output
        run: |
          cp profile-3d-contrib/profile-neon.svg assets/neon/calendar-3d.svg
          python3 scripts/strip-calendar-pie.py assets/neon/calendar-3d.svg
          rm -rf profile-3d-contrib

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh profile assets"
          git push
